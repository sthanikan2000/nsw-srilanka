name: Release - Build and Publish Images
# Builds and publishes the platform Docker images (Trader Portal + Backend API) to GHCR.
#
# Triggers:
#   - Automatic: pushing a SemVer tag (e.g. v1.2.0) triggers a full release.
#   - Manual:    workflow_dispatch with a version input for hotfixes or re-releases.
#
# Release mode vs Dry Run:
#   Images are only pushed when triggered by a tag push OR a manual dispatch
#   with a version input. Any other trigger runs in dry-run mode: images are
#   built but not pushed and no GitHub Release is created.
#
# Outputs for gitops.yaml:
#   The image digest is written to the GitHub Release as a JSON asset
#   (release-digests.json). gitops.yaml reads this file to verify the image
#   before updating ArgoCD manifests — no rebuild, no guesswork.

on:
  # Automatic: pushing a SemVer tag (e.g. v1.2.0) triggers a full release.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0)'
        required: true

env:
  REGISTRY: ghcr.io
  # Platforms baked into every published manifest list. The Trivy steps below
  # iterate this same list, so adding a platform here widens the CVE gate too —
  # but remember to add a matching "Upload Trivy results" step, since each needs
  # its own SARIF category.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: Build, tag, and publish the image. Writes the image digest to a
  # file so Stage 2 can bundle it into release-digests.json and attach it to
  # the GitHub Release.
  # ---------------------------------------------------------------------------
  build-and-publish:
    name: Build and Publish - ${{ matrix.service_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: Trader Portal
            image_name: tnsw-web
            context: ./portals
            dockerfile: ./portals/apps/trader-app/Dockerfile
            description: NSW Trader Portal Frontend
          - service_name: NSW Backend API
            image_name: tnsw-api
            context: .
            dockerfile: ./Dockerfile
            description: NSW Backend API Service
          - service_name: NSW Migrate
            image_name: tnsw-migrate
            context: .
            dockerfile: ./Dockerfile
            description: NSW schema migrator (nsw-agency migrate tool)
            # The migrator is a non-default stage; other entries have no target
            # and build their Dockerfile's default (last) stage.
            target: migrate
    permissions:
      packages: write          # push images to GHCR
      security-events: write   # upload Trivy SARIF results to GitHub Security
      id-token: write          # required for SLSA provenance attestation signing

    env:
      GIT_COMMIT: ${{ github.sha }}

    outputs:
      release_enabled: ${{ steps.release-mode.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for accurate git metadata

      - name: Set build time
        id: build-time
        run: |
          # repository.pushed_at is reliably populated on both push and workflow_dispatch.
          # github.event.head_commit.timestamp is NOT available on workflow_dispatch
          # so we fall back to the current time if pushed_at is also empty.
          TIMESTAMP="${{ github.event.repository.pushed_at }}"
          if [ -z "$TIMESTAMP" ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "build_time=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "Build time set to: $TIMESTAMP"

      - name: Determine release mode
        id: release-mode
        run: |
          # Release mode: tag push OR manual dispatch with a version input.
          # Pure branch pushes without a version input remain a dry run.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release mode enabled - image will be pushed"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dry run mode - image will be built only"
          fi

      # Registers binfmt handlers for the foreign-arch RUN steps in the final
      # image stages (apk add, adduser, chmod) — the builder stages themselves are
      # pinned to $BUILDPLATFORM and run natively, so almost nothing is emulated.
      # Must come BEFORE setup-buildx-action: buildkitd determines which platforms
      # it can serve when it starts, so a builder booted before binfmt is
      # registered may never advertise linux/arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release-mode.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          # Resolve the version string from whichever trigger fired.
          # Strip the leading 'v' so downstream steps always get a bare semver (e.g. 1.2.0).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}
          tags: |
            # semver tags for tag-push releases: 1.2.3, 1.2, 1
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'push' }}
            # For manual dispatch, raw tag covers the exact version supplied.
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'workflow_dispatch' }}
            # 'latest' is only written in release mode (never on dry runs)
            type=raw,value=latest,enable=${{ steps.release-mode.outputs.enabled == 'true' }}
            # Always write a full-length SHA tag for traceability
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ env.GIT_COMMIT }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.build_time }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Empty for default-stage images; set to `migrate` for the migrator.
          target: ${{ matrix.target }}
          # Publishes one manifest list per tag. steps.build.outputs.digest then
          # refers to that list rather than a single platform's image, which is
          # precisely what release-digests.json should pin — an
          # image@sha256:<list-digest> reference resolves per node architecture.
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.release-mode.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.tag }}
          # provenance and sbom attach SLSA build attestations to the image in GHCR.
          provenance: mode=max
          sbom: true
          # Scope cache per image so the two matrix builds don't overwrite each other's layers.
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

      # Write the image digest to a file so the collate job can bundle it
      # into release-digests.json for gitops.yaml to consume.
      - name: Save image digest
        if: steps.release-mode.outputs.enabled == 'true' && steps.build.outputs.digest != ''
        run: |
          mkdir -p /tmp/digests
          echo '${{ steps.build.outputs.digest }}' > /tmp/digests/${{ matrix.image_name }}.txt
          echo "Saved digest for ${{ matrix.image_name }}: ${{ steps.build.outputs.digest }}"

      - name: Upload digest artifact
        if: steps.release-mode.outputs.enabled == 'true' && steps.build.outputs.digest != ''
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image_name }}
          path: /tmp/digests/${{ matrix.image_name }}.txt
          retention-days: 1

      # Trivy scans the pushed image for CRITICAL/HIGH CVEs.
      - name: Setup Trivy
        if: steps.release-mode.outputs.enabled == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.69.3

      # The tag now points at a manifest list, and `trivy image` resolves one to a
      # single entry (the runner's own platform) instead of scanning them all — so
      # each platform is scanned explicitly, or arm64 would ship unscanned past the
      # gate. --platform needs the full os/arch form: a bare `arm64` is parsed as an
      # OS name and silently matches nothing.
      #
      # --exit-code 0 keeps a finding from aborting the loop and costing us the
      # remaining platforms' reports. Pass/fail moved to "Enforce Trivy gate" below,
      # which is also what makes the upload reachable on the runs that found
      # something: while the scan itself gated on --exit-code 1, a scan that found
      # CVEs counted as failed and its SARIF was never uploaded, so the Security tab
      # only ever received clean reports.
      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        if: steps.release-mode.outputs.enabled == 'true'
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          # This step deliberately never fails. A transient failure on one platform
          # must not discard the SARIF already written for another, nor skip the
          # uploads below — both the scan failures and the findings are adjudicated
          # by "Enforce Trivy gate".
          FAILED_PLATFORMS=""
          for PLATFORM in ${PLATFORMS//,/ }; do
            SLUG="${PLATFORM//\//-}"
            echo "::group::Trivy ${{ matrix.image_name }} ${PLATFORM}"
            # --image-src remote is load-bearing, not a default restated: the
            # `docker` source has priority by default and silently IGNORES
            # --platform, reporting the daemon's own copy instead. That is inert
            # while nothing loads the tag locally, but it would quietly turn both
            # per-platform scans into two scans of the same arch.
            if trivy image \
                 --image-src remote \
                 --platform "$PLATFORM" \
                 --severity HIGH,CRITICAL \
                 --ignore-unfixed \
                 --format sarif \
                 --output "trivy-${{ matrix.image_name }}-${SLUG}.sarif" \
                 --exit-code 0 \
                 "$IMAGE_REF"; then
              # Same scan again for a human-readable table; Trivy's DB and layer
              # caches are warm by now, so this is cheap. Never fatal: the SARIF
              # above is the authoritative artifact.
              trivy image \
                --image-src remote \
                --platform "$PLATFORM" \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --format table \
                --exit-code 0 \
                "$IMAGE_REF" || true
            else
              echo "::error::Trivy could not scan ${PLATFORM} — the gate below will fail."
              FAILED_PLATFORMS="${FAILED_PLATFORMS} ${PLATFORM}"
            fi
            echo "::endgroup::"
          done
          echo "failed_platforms=${FAILED_PLATFORMS# }" >> "$GITHUB_OUTPUT"

      # One upload per (image, platform). The category must be unique per upload:
      # two uploads from the same tool sharing a category is treated as a
      # misconfiguration and fails the whole run, not just the second upload.
      # outcome == 'success' now means "the scan completed", not "found nothing".
      # The hashFiles guard keeps a narrowed PLATFORMS (or a platform that failed
      # to scan) from failing the run here, after the images are already pushed.
      # An unscanned platform is still caught — by the gate, which is the right
      # place for it.
      - name: Upload Trivy results (linux/amd64)
        if: always() && steps.trivy-scan.outcome == 'success' && hashFiles(format('trivy-{0}-linux-amd64.sarif', matrix.image_name)) != ''
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: trivy-${{ matrix.image_name }}-linux-amd64.sarif
          category: ${{ matrix.image_name }}-linux-amd64

      - name: Upload Trivy results (linux/arm64)
        if: always() && steps.trivy-scan.outcome == 'success' && hashFiles(format('trivy-{0}-linux-arm64.sarif', matrix.image_name)) != ''
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: trivy-${{ matrix.image_name }}-linux-arm64.sarif
          category: ${{ matrix.image_name }}-linux-arm64

      # The gate the scan used to apply itself. Runs after the uploads so the
      # findings reach the Security tab even on the runs this fails.
      - name: Enforce Trivy gate
        if: always() && steps.trivy-scan.outcome == 'success'
        run: |
          # An unscanned platform is a gate failure, not a pass: otherwise a
          # transient Trivy error would wave a platform through unexamined.
          if [ -n "${{ steps.trivy-scan.outputs.failed_platforms }}" ]; then
            echo "::error::Trivy did not scan: ${{ steps.trivy-scan.outputs.failed_platforms }} — refusing to pass an unscanned platform."
            exit 1
          fi
          FAILED=0
          for FILE in trivy-${{ matrix.image_name }}-*.sarif; do
            COUNT=$(jq '[.runs[].results[]] | length' "$FILE")
            echo "$FILE: $COUNT fixable HIGH/CRITICAL finding(s)"
            if [ "$COUNT" -gt 0 ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Fixable HIGH/CRITICAL CVEs found in ${{ matrix.image_name }} — see the job log and the Security tab."
            exit 1
          fi
          echo "No fixable HIGH/CRITICAL CVEs on any published platform."

      - name: Generate service summary
        if: always()
        run: |
          echo "## Service: ${{ matrix.service_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.release-mode.outputs.enabled == 'true' && 'Release' || 'Dry Run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.build.outputs.digest }}" ]; then
            echo "- Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # STAGE 2: Collate the digest artifact into one JSON file and attach it to
  # the GitHub Release so gitops.yaml can fetch it.
  # Runs only in release mode after the build finishes.
  # ---------------------------------------------------------------------------
  collate-digests:
    name: Collate Image Digests
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: needs.build-and-publish.outputs.release_enabled == 'true'
    outputs:
      version: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digest artifact
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Build release-digests.json
        run: |
          # Merge the per-service digest file into one JSON object:
          # { "trader-app": "sha256:abc..." }
          echo "{" > release-digests.json
          FIRST=true
          for FILE in /tmp/digests/*.txt; do
            IMAGE_NAME=$(basename "$FILE" .txt)
            DIGEST=$(cat "$FILE")
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> release-digests.json
            fi
            echo "  \"${IMAGE_NAME}\": \"${DIGEST}\"" >> release-digests.json
          done
          echo "}" >> release-digests.json
          echo "Generated release-digests.json:"
          cat release-digests.json

      - name: Upload collated digests
        uses: actions/upload-artifact@v7
        with:
          name: release-digests
          path: release-digests.json
          retention-days: 1

  # ---------------------------------------------------------------------------
  # STAGE 3: Create the GitHub Release entry and attach release-digests.json.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: collate-digests
    permissions:
      contents: write   # required to create a GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download collated digests
        uses: actions/download-artifact@v8
        with:
          name: release-digests
          path: .

      - name: Create git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v${{ needs.collate-digests.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          else
            echo "Tag $TAG already exists — skipping creation"
          fi

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.collate-digests.outputs.version) || github.ref }}
          name: Release ${{ needs.collate-digests.outputs.version }}
          body: |
            ## Release ${{ needs.collate-digests.outputs.version }}

            This release publishes the platform Docker images for the NSW Single Window.

            ### Published Image Targets
            - `${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/tnsw-web:${{ needs.collate-digests.outputs.version }}`
            - `${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/tnsw-api:${{ needs.collate-digests.outputs.version }}`
            - `${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/tnsw-migrate:${{ needs.collate-digests.outputs.version }}`

            ### Pull Images
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/tnsw-web:${{ needs.collate-digests.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/tnsw-api:${{ needs.collate-digests.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/tnsw-migrate:${{ needs.collate-digests.outputs.version }}
            ```

            ### Supported Platforms
            Every image above is a multi-arch manifest list covering
            `linux/amd64` and `linux/arm64` — one tag resolves correctly on
            both x86_64 and arm64 (Graviton/Ampere) nodes, and on Apple Silicon.

            ### Image Digests
            See `release-digests.json` attached to this release for the exact SHA256 digest
            of each image — used by the GitOps pipeline to verify them before deploying.
          draft: false
          prerelease: ${{ needs.collate-digests.outputs.is_prerelease == 'true' }}
          # Attach the digest manifest so gitops.yaml can fetch it directly
          # from the release assets without needing to rebuild or re-tag anything.
          files: release-digests.json