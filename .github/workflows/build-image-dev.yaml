# Reusable workflow: build one development image and push it to GHCR.
# Called by the per-service trigger workflows (build-backend-dev, build-migrate-dev,
# build-portal-dev), each of which supplies the context/dockerfile/target inputs.
name: Build & Push Dev Image

on:
  workflow_call:
    inputs:
      service_name:
        description: Human-readable service name (display only).
        required: true
        type: string
      image_name:
        description: GHCR image repository name (e.g. tnsw-api).
        required: true
        type: string
      context:
        description: Docker build context path.
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile.
        required: true
        type: string
      target:
        description: Build stage to target. Empty builds the default (last) stage.
        required: false
        type: string
        default: ""
      platforms:
        description: >-
          Platforms to include in the published manifest list. Callers can narrow
          this to a single platform for a faster build; the default publishes both
          so arm64 nodes and Apple Silicon developers can run the dev images
          without emulation.
        required: false
        type: string
        default: linux/amd64,linux/arm64

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-dev:
    name: Build & Push Dev – ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Registers binfmt handlers for the foreign-arch RUN steps in the final
      # image stages (apk add, adduser, chmod) — the builder stages themselves are
      # pinned to $BUILDPLATFORM and run natively, so almost nothing is emulated.
      # Must come BEFORE setup-buildx-action: buildkitd determines which platforms
      # it can serve when it starts, so a builder booted before binfmt is
      # registered may never advertise linux/arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          # Empty for default-stage images; set to `migrate` for the migrator.
          target: ${{ inputs.target }}
          # Publishes one manifest list covering every platform, so a single tag
          # resolves correctly on both amd64 and arm64 nodes.
          platforms: ${{ inputs.platforms }}
          push: true
          # Sequential run numbers let Argo CD Image Updater sort/detect the newest dev builds.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/${{ inputs.image_name }}:dev-${{ github.run_number }}-${{ github.sha }}
          build-args: |
            BUILD_VERSION=dev-${{ github.run_number }}-${{ github.sha }}
          # Scope cache per image so concurrent builds don't overwrite each other's layers.
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
